[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-mcp"
version = "0.2.0"
description = "FastMCP 3.1: RSS/Atom feeds, Open-Meteo weather (no API key), and HTTP health probes for local fleet — minimal keys, httpx + feedparser."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16.0,<0.17"]

[project.urls]
Homepage = "https://github.com/sandraschi/glance-mcp"
Repository = "https://github.com/sandraschi/glance-mcp"
Issues = "https://github.com/sandraschi/glance-mcp/issues"

[project.scripts]
glance-mcp = "glance_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "RUF002", "S106", "S110", "S112", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17",
]
